<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Car Rental</title>
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://kit.fontawesome.com/d04438ae8d.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <!-- Navigation Bar -->
    <nav>
      <div class="row nav__row">
        <a href="#" class="nav__img__wrapper">
          <img src="images/logo.png" alt="logo" class="nav__img" />
        </a>
        <div class="nav__links">
          <a href="#" class="nav__link">Home</a>
          <a href="#" class="nav__link">About</a>
          <a href="#" class="nav__link">Vehicle Models</a>
          <a href="#" class="nav__link">Testimonials</a>
          <a href="#" class="nav__link">Our Team</a>
          <a href="#" class="nav__link">Contact</a>
        </div>
        <div class="nav__btns">
          <a href="#" class="nav__link">Sign In</a>
          <button class="nav__btns__register">Register</button>
        </div>
      </div>
    </nav>

    <!-- Hero -->
    <header>
      <img src="images/header-bg.png" alt="" class="header-bg" />
      <div class="row header__row">
        <div class="header__text">
          <h4 class="header__text__subtitle">Plan your trip now</h4>
          <h1 class="header__text__title">
            Save <span class="color-primary">big</span> with our car rental
          </h1>
          <p class="header__text__para">
            Rent the car of your dreams. Unbeatable prices, unlimited miles,
            flexible pick-up options and much more.
          </p>
          <div class="header__text__btns">
            <button class="header__text__btn header__text__book">
              <span class="header__text__btn__span">Book Ride</span>
              <i class="fa-regular fa-circle-check header__text__btn__icon"></i>
            </button>
            <button class="header__text__btn header__text__learn">
              <span class="header__text__btn__span">Learn More</span>
              <i class="fa-solid fa-greater-than header__text__btn__icon"></i>
            </button>
          </div>
        </div>
        <figure class="header__img__wrapper">
            <img src="images/header-car.png" alt="car" class="header__img">
        </figure>
      </div>
    </header>
  </body>
</html>
